services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: alpine_security
      POSTGRES_USER: alpine_security
      POSTGRES_PASSWORD: alpine_security
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alpine_security']
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10
    command:
      - -url=jdbc:postgresql://postgres:5432/alpine_security
      - -user=alpine_security
      - -password=alpine_security
      - -connectRetries=10
      - migrate
    volumes:
      - ./apps/api/db/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
