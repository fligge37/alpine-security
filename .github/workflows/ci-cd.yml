name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deployed wird nicht bei jedem Push nach main (bei Solo-Arbeit ohne Branches
  # landet dort auch WIP-Code), sondern nur für einen Commit, den man bewusst
  # mit einem "v*"-Tag markiert, oder per manuellem "Run workflow"-Knopf in der
  # GitHub-Actions-UI (dort lässt sich der Branch/Tag auswählen, auf den
  # deployed wird). Lint/Tests/Build laufen trotzdem bei jedem Push, damit man
  # zeitnah Feedback bekommt, ohne dass das schon live geht.
  plan:
    name: Deploy-Entscheidung
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - id: decide
        run: |
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint, Format, Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Tests (echtes Postgres+PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: alpine_security
          POSTGRES_USER: alpine_security
          POSTGRES_PASSWORD: alpine_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpine_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gleiches Migrations-Tool wie lokal/prod (Flyway), nur direkt per `docker
      # run` statt Compose - der Postgres-Service oben läuft schon als Container
      # auf dem Runner, --network host lässt Flyway ihn über localhost erreichen.
      - name: Migrationen anwenden
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/apps/api/db/migrations:/flyway/sql \
            flyway/flyway:10 \
            -url=jdbc:postgresql://localhost:5432/alpine_security \
            -user=alpine_security -password=alpine_security \
            -connectRetries=10 migrate
      - name: API-Tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://alpine_security:alpine_security@localhost:5432/alpine_security
          JWT_SECRET: ci-test-secret
        run: pnpm test

  build-api-image:
    name: API-Docker-Image bauen (+ pushen bei Deploy)
    needs: [plan, quality, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Der Standard-Docker-Treiber kann den "gha"-Cache-Backend unten nicht,
      # nur der docker-container-Treiber von Buildx.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/alpine-security-api
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ needs.plan.outputs.deploy == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ needs.plan.outputs.deploy == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-static:
    name: Web/Dashboard bauen
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alpine-security/web build
      - run: pnpm --filter @alpine-security/dashboard build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: apps/dashboard/dist

  deploy:
    name: Auf den VPS ausrollen
    if: needs.plan.outputs.deploy == 'true'
    needs: [plan, build-api-image, build-static]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist
      - name: SSH-Key laden
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Dateien auf den Server kopieren
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /opt/alpine-security/deploy"
          rsync -az --delete web-dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/alpine-security/deploy/web-dist/"
          rsync -az --delete dashboard-dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/alpine-security/deploy/dashboard-dist/"
          rsync -az apps/api/db/migrations/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/alpine-security/deploy/migrations/"
          # Kein --delete hier: deploy/.env liegt im selben Ordner auf dem Server
          # und darf nicht mitgelöscht werden, nur weil sie nicht im Repo liegt.
          rsync -az deploy/docker-compose.yml deploy/Caddyfile \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/alpine-security/deploy/"
      - name: Migrieren und neu starten
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/alpine-security/deploy
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env
            docker compose --env-file .env pull api
            docker compose --env-file .env run --rm flyway
            docker compose --env-file .env up -d
          '
